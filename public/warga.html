<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Penerima & Kupon Qurban AL-HIKMAH</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/store.js"></script>
<script src="assets/xlsx.full.min.js"></script>
<script src="assets/qrcode.min.js"></script>
<link rel="stylesheet" href="assets/style.css">
<style>
.container {
  display: grid;
  grid-template-columns: 21.875rem 1fr;
  gap: 0.9375rem;
  flex: 1;
}

/* Form Styles */
.form-group { margin-bottom: 0.75rem; }
.form-group label { display: block; font-size: 0.8em; color: #888; margin-bottom: 5px; }
input[type="text"], input[type="number"], select {
  width: 100%;
  padding: 0.625rem;
  font-size: 0.9em;
  transition: all 0.3s;
}

.btn-lg { display: flex; align-items: center; justify-content: center; gap: 8px; }

/* Table Styles */
.table-container { flex: 1; overflow-y: auto; max-height: 31.25rem; }
th { padding: 0.75rem; text-align: left; z-index: 10; }
td { padding: 0.625rem 0.75rem; text-align: left; font-size: 0.9em; }

.badge-rt {
  background: rgba(16, 185, 129, 0.18);
  color: #6ee7b7;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.8em;
  font-weight: bold;
}

/* Stats */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.25rem, 1fr)); gap: 0.625rem; margin-top: 0.9375rem; }
.stat-card { padding: 0.625rem; }
.stat-card .val { display: block; font-size: 1.2em; font-weight: 700; color: #34d399; }
.stat-card .lbl { font-size: 0.7em; color: #888; text-transform: uppercase; }

/* Print Styles */
@media print {
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { position: absolute; left: 0; top: 0; width: 100%; background: white !important; color: black !important; padding: 0 !important; }
  .no-print { display: none !important; }
  .coupon { border: 2px solid #000 !important; }
  table.print-table { width: 100%; border-collapse: collapse; margin-top: 20px; table-layout: fixed; }
  table.print-table th, table.print-table td { 
    border: 0.7pt solid #222 !important; 
    padding: 5px 7px; 
    color: #000 !important; 
    font-size: 9.5pt !important;
  }
  table.print-table th { 
    background: #f5f5f5 !important; 
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    white-space: normal !important;
    font-weight: 600 !important;
  }
  table.print-table td {
    white-space: nowrap !important;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  @page {
    size: A4;
  }
}

#printArea { display: none; }
.coupon-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
.coupon {
  border: 1.5px dashed #333;
  padding: 8px;
  border-radius: 6px;
  position: relative;
  background-color: white;
  /* Ornamen sudut kupon (cetak hitam sederhana) */
  background-image:
    linear-gradient(#a08c4a, #a08c4a), linear-gradient(#a08c4a, #a08c4a),
    linear-gradient(#a08c4a, #a08c4a), linear-gradient(#a08c4a, #a08c4a),
    linear-gradient(#a08c4a, #a08c4a), linear-gradient(#a08c4a, #a08c4a),
    linear-gradient(#a08c4a, #a08c4a), linear-gradient(#a08c4a, #a08c4a);
  background-repeat: no-repeat;
  background-size: 9px 1px, 1px 9px, 9px 1px, 1px 9px, 9px 1px, 1px 9px, 9px 1px, 1px 9px;
  background-position: 3px 3px, 3px 3px, calc(100% - 3px) 3px, calc(100% - 3px) 3px, 3px calc(100% - 3px), 3px calc(100% - 3px), calc(100% - 3px) calc(100% - 3px), calc(100% - 3px) calc(100% - 3px);
  color: black;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  box-sizing: border-box;
}
.coupon-header { border-bottom: 1px solid #eee; padding-bottom: 3px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
.coupon-title { font-size: 9px; font-weight: bold; }
.coupon-no { font-size: 11px; font-weight: 900; background: #eee; padding: 1px 5px; border-radius: 3px; }
.coupon-body { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.coupon-name { font-size: 13px; font-weight: bold; margin-bottom: 2px; line-height: 1.1; }
.coupon-address { font-size: 9px; color: #555; }
.coupon-footer { font-size: 7px; color: #888; border-top: 1px dotted #ccc; padding-top: 3px; margin-top: 5px; display: flex; justify-content: space-between; }
.watermark { position: absolute; right: 5px; bottom: 15px; font-size: 25px; opacity: 0.08; transform: rotate(-20deg); font-weight: bold; pointer-events: none; }
.coupon-qr { flex: 0 0 auto; }
.coupon-qr svg { width: 100%; height: 100%; display: block; background: white; }

/* Custom Alert */
.custom-alert-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 10, 20, 0.65);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  padding: 16px;
}

.custom-alert-overlay.show {
  display: flex;
  animation: fadeIn 0.2s ease;
}

.custom-alert-box {
  width: min(620px, 96vw);
  max-height: 85vh;
  overflow: auto;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.12);
  background: linear-gradient(160deg, rgba(9, 35, 27, 0.96), rgba(13, 42, 32, 0.96));
  box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  color: #e5e7eb;
  animation: zoomIn 0.2s ease;
}

.custom-alert-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

.custom-alert-title {
  font-size: 0.95em;
  font-weight: 700;
  color: #6ee7b7;
}

.custom-alert-close {
  border: 0;
  background: rgba(255,255,255,0.08);
  color: #d1d5db;
  border-radius: 8px;
  width: 30px;
  height: 30px;
  cursor: pointer;
  font-size: 16px;
}

.custom-alert-body {
  padding: 14px 16px 8px;
  white-space: pre-line;
  line-height: 1.55;
  font-size: 0.92em;
}

.custom-alert-foot {
  padding: 12px 16px 16px;
  display: flex;
  justify-content: flex-end;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes zoomIn {
  from { transform: scale(0.97); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

</style>
</head>
<body>

<header>
  <h1>👥 Penerima & Kupon Qurban</h1>
  <div class="nav-group">
    <button class="btn btn-nav outline" onclick="location.href='index.html'">📊 Kalkulator Daging</button>
    <button class="btn btn-nav active" onclick="location.href='warga.html'">👥 Data Warga & Kupon</button>
    <div class="nav-divider"></div>
    <button class="btn btn-nav outline" onclick="exportData()" title="Backup Data ke File">💾 Export</button>
    <button class="btn btn-nav outline" onclick="exportExcel()" title="Export Daftar Warga ke Excel">📊 Excel</button>
    <button class="btn btn-nav outline" onclick="document.getElementById('importFile').click()" title="Import JSON / CSV / Excel">📥 Import</button>
    <button class="btn btn-nav outline" onclick="generateAttendanceList()">📋 Daftar Hadir</button>
    <button class="btn btn-nav outline" onclick="location.href='scanner.html'" title="Scan QR kupon untuk verifikasi tukar">📷‍ Scan QR</button>
    <button class="btn btn-nav outline" onclick="location.href='live.html'" title="Papan counter live tukar kupon">📺 Live</button>
    <button class="btn btn-nav" onclick="generateCoupons()">🎟️ Cetak Kupon</button>
    <input type="file" id="importFile" style="display:none" accept=".json,.csv,.xls,.xlsx" onchange="importData(this)">
  </div>
</header>

<div class="container">
  <!-- Kiri: Form Input -->
  <div class="panel">
    <div class="panel-header">
      <h2 id="formTitle">Tambah Penerima</h2>
    </div>
    <form id="wargaForm" onsubmit="event.preventDefault(); tambahWarga();">
      <div class="form-group">
        <label>Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Masukkan nama warga..." required autocomplete="off">
      </div>
      <div class="form-group">
        <label>RT (Contoh: 01, 02...)</label>
        <input type="text" id="rt" placeholder="RT" required>
      </div>
      <button type="submit" class="btn btn-lg" style="width:100%; margin-top:10px;">Tambah Warga</button>
      <button type="button" id="editBatal" class="btn btn-outline btn-lg" style="width:100%; margin-top:6px; display:none;" onclick="batalEdit()">Batal Edit</button>
    </form>

    <div class="panel-header" style="margin-top:25px;">
      <h2>Layout Cetak Kupon</h2>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
      <div class="form-group">
        <label>Kolom</label>
        <input type="number" id="kuponKolom" value="3" min="1" max="5">
      </div>
      <div class="form-group">
        <label>Baris</label>
        <input type="number" id="kuponBaris" value="6" min="1" max="10">
      </div>
      <div class="form-group">
        <label>Margin (mm)</label>
        <input type="number" id="kuponMargin" value="10" min="0" max="30">
      </div>
      <div class="form-group">
        <label>Jarak (mm)</label>
        <input type="number" id="kuponGap" value="2" min="0" max="10">
      </div>
      <div class="form-group">
        <label>Tahun Hijriah</label>
        <input type="text" id="tahunHijriah" value="1447" placeholder="Contoh: 1447">
      </div>
      <div class="form-group">
        <label>Ukuran Teks (%)</label>
        <input type="number" id="kuponFontSize" value="100" min="50" max="200">
      </div>
      <div class="form-group">
        <label>QR Code</label>
        <select id="kuponQR">
          <option value="1">Aktif</option>
          <option value="0">Nonaktif</option>
        </select>
      </div>
      <div class="form-group">
        <label>Ukuran QR (mm)</label>
        <input type="number" id="kuponQRSize" value="12" min="6" max="25">
      </div>
    </div>

    <div class="panel-header" style="margin-top:25px;">
      <h2>Statistik RT</h2>
    </div>
    <div class="stats-grid" id="statsContainer">
      <!-- Stats per RT will be injected here -->
    </div>
  </div>

  <!-- Kanan: Tabel Data -->
  <div class="panel">
    <div class="panel-header">
      <div style="display:flex; flex-direction:column; gap:5px; width:100%;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2>Daftar Penerima (<span id="totalWarga">0</span> Orang)</h2>
          <button class="btn btn-danger" onclick="hapusSemua()" style="padding:5px 12px; font-size:0.75em;">Kosongkan Semua</button>
        </div>
        <input type="text" id="cariWarga" placeholder="🔍 Cari nama atau RT..." oninput="renderTable()" style="margin-top:10px; width:100%; background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.2);">
      </div>
    </div>
    <div class="table-container">
      <table id="tabelWarga">
        <thead>
          <tr>
            <th width="50">No</th>
            <th width="70">Kupon</th>
            <th>Nama Warga</th>
            <th width="100">RT</th>
            <th width="60">Tukar</th>
            <th width="110">Aksi</th>
          </tr>
        </thead>
        <tbody>
          <!-- Data will be injected here -->
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Area Kupon (Hidden from screen, visible for print) -->
<div id="printArea">
  <div class="coupon-grid" id="couponContainer">
    <!-- Coupons will be generated here -->
  </div>
</div>

<div class="custom-alert-overlay" id="customAlertOverlay" onclick="handleAlertOverlayClick(event)">
  <div class="custom-alert-box">
    <div class="custom-alert-head">
      <div class="custom-alert-title" id="customAlertTitle">Informasi</div>
      <button type="button" class="custom-alert-close" onclick="closeAlert()">×</button>
    </div>
    <div class="custom-alert-body" id="customAlertMessage"></div>
    <div class="custom-alert-foot">
      <button type="button" class="btn btn-lg" onclick="closeAlert()">OK</button>
    </div>
  </div>
</div>

<script>
let daftarWarga = [];
let editingId = null;

function esc(value) {
    const div = document.createElement('div');
    div.textContent = String(value ?? '');
    return div.innerHTML;
}

function escAttr(value) {
    return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

function showAlert(message, title = 'Informasi') {
    const overlay = document.getElementById('customAlertOverlay');
    document.getElementById('customAlertTitle').textContent = title;
    document.getElementById('customAlertMessage').textContent = message;
    overlay.classList.add('show');
}

function closeAlert() {
    document.getElementById('customAlertOverlay').classList.remove('show');
}

function handleAlertOverlayClick(event) {
    if (event.target.id === 'customAlertOverlay') closeAlert();
}

document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') closeAlert();
});


const KUPON_LAYOUT_KEY = 'qurbanKuponLayout';
const kuponLayoutFields = ['kuponKolom', 'kuponBaris', 'kuponMargin', 'kuponGap', 'tahunHijriah', 'kuponFontSize', 'kuponQR', 'kuponQRSize'];

function loadKuponLayout() {
    const saved = localStorage.getItem(KUPON_LAYOUT_KEY);
    if (!saved) return;

    try {
        const parsed = JSON.parse(saved);
        kuponLayoutFields.forEach((id) => {
            const el = document.getElementById(id);
            if (!el) return;
            const value = parsed[id];
            if (value === undefined || value === null || value === '') return;
            el.value = String(value);
        });
    } catch (err) {
        localStorage.removeItem(KUPON_LAYOUT_KEY);
    }
}

function saveKuponLayout() {
    const payload = {};
    kuponLayoutFields.forEach((id) => {
        const el = document.getElementById(id);
        if (el) payload[id] = el.value;
    });
    localStorage.setItem(KUPON_LAYOUT_KEY, JSON.stringify(payload));
}

function bindKuponLayoutListeners() {
    kuponLayoutFields.forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('input', saveKuponLayout);
        el.addEventListener('change', saveKuponLayout);
    });
}

function formatKupon(num) {
    return '#' + String(num || 0).padStart(3, '0');
}

function sortWargaCopy(list) {
    return [...(list || daftarWarga)].sort((a, b) => {
        if (a.rt !== b.rt) return a.rt.localeCompare(b.rt, undefined, {numeric: true});
        return a.nama.localeCompare(b.nama);
    });
}

function tampilkanGalatServer(err, konteks) {
    const detail = String(err?.message || err || 'Tidak diketahui');
    showAlert(
        `${konteks}\nDetail: ${detail}` +
        (QurbanStore.konfigurasiLengkap() ? '' : `\n\n${QurbanStore.pesananKonfigurasi()}`),
        'Koneksi Gagal'
    );
}

// Muat data sekali dari Firestore (contoh: setelah import / edit usang)
async function loadData() {
    try {
        daftarWarga = await QurbanStore.muatSemua();
    } catch (err) {
        daftarWarga = [];
        tampilkanGalatServer(err, 'Gagal memuat data dari Firestore.');
    } finally {
        renderTable();
        renderStats();
    }
}

// Langganan realtime: tabel & statistik ikut berubah otomatis
// saat panitia lain (mis. halaman scan) menandai penukaran.
let migrasiBerjalan = false;

function mulaiSinkron() {
    if (!QurbanStore.konfigurasiLengkap()) {
        tampilkanGalatServer(new Error(QurbanStore.pesananKonfigurasi()), 'Konfigurasi Firebase belum siap.');
        return;
    }
    QurbanStore.dengarkan(async (rows) => {
        daftarWarga = rows;
        if (rows.length === 0 && !migrasiBerjalan) {
            migrasiBerjalan = true;
            try {
                await migrasiDataLokal();
                daftarWarga = await QurbanStore.muatSemua();
            } finally {
                migrasiBerjalan = false;
            }
        }
        renderTable();
        renderStats();
    }, (err) => tampilkanGalatServer(err, 'Koneksi realtime ke Firestore terputus.'));
}

// Kirim data lama localStorage ke Firestore saat pertama kali dipakai
async function migrasiDataLokal() {
    if (localStorage.getItem('qurbanMigrasiServer') === '1') return;
    const saved = localStorage.getItem('qurbanWarga');
    if (!saved) return;

    let parsed;
    try {
        parsed = JSON.parse(saved);
    } catch (err) {
        return;
    }
    if (!Array.isArray(parsed) || !parsed.length) return;

    const rows = parsed
        .map(w => ({
            nama: String(w.nama || '').trim(),
            rt: String(w.rt || '').trim(),
            noKupon: w.noKupon,
            sudahTukar: w.sudahTukar === true
        }))
        .filter(w => w.nama && w.rt);
    if (!rows.length) return;

    const kirim = confirm(
        `Terdeteksi ${rows.length} data warga di perangkat ini (localStorage).\n` +
        'Kirim ke Firestore agar terintegrasi antar perangkat?\n' +
        '(Data lokal tetap dipertahankan sebagai backup.)'
    );
    if (!kirim) {
        localStorage.setItem('qurbanMigrasiServer', '1');
        return;
    }

    try {
        await QurbanStore.importWarga(rows, 'timpa');
        localStorage.setItem('qurbanMigrasiServer', '1');
        showAlert('Data lama dari perangkat ini berhasil dikirim ke Firestore.', 'Migrasi Data');
    } catch (err) {
        tampilkanGalatServer(err, 'Gagal mengirim data lokal ke Firestore.');
    }
}

function cariWargaById(id) {
    return daftarWarga.find(w => w.id === id);
}

function setFormEditMode(aktif) {
    document.getElementById('formTitle').textContent = aktif ? 'Edit Penerima' : 'Tambah Penerima';
    document.querySelector('#wargaForm button[type="submit"]').textContent = aktif ? 'Simpan Perubahan' : 'Tambah Warga';
    document.getElementById('editBatal').style.display = aktif ? 'flex' : 'none';
}

function mulaiEdit(id) {
    const warga = cariWargaById(id);
    if (!warga) return;
    editingId = id;
    document.getElementById('nama').value = warga.nama;
    document.getElementById('rt').value = warga.rt;
    setFormEditMode(true);
    const namaInput = document.getElementById('nama');
    namaInput.focus();
    namaInput.select();
}

function batalEdit() {
    editingId = null;
    setFormEditMode(false);
    document.getElementById('nama').value = '';
    document.getElementById('rt').value = '';
    document.getElementById('nama').focus();
}

async function tambahWarga() {
    const namaInput = document.getElementById('nama');
    const rtInput = document.getElementById('rt');
    const nama = namaInput.value.trim();
    const rt = rtInput.value.trim();

    if (!nama || !rt) {
        showAlert('Nama dan RT wajib diisi.', 'Input Belum Lengkap');
        return;
    }

    const submitBtn = document.querySelector('#wargaForm button[type="submit"]');
    submitBtn.disabled = true;
    try {
        if (editingId !== null) {
            const id = editingId;
            const warga = cariWargaById(id);
            editingId = null;
            setFormEditMode(false);
            namaInput.value = '';
            rtInput.value = '';
            namaInput.focus();
            if (!warga) {
                showAlert('Data yang diedit tidak ditemukan lagi.', 'Edit Dibatalkan');
                loadData();
                return;
            }
            const diperbarui = await QurbanStore.ubah(id, { nama, rt });
            Object.assign(warga, diperbarui);
            renderTable();
            renderStats();
            showAlert('Perubahan data warga telah disimpan.', 'Edit Berhasil');
            return;
        }

        const baru = await QurbanStore.tambah(nama, rt);
        daftarWarga.push(baru);
        namaInput.value = '';
        namaInput.focus();
        renderTable();
        renderStats();
    } catch (err) {
        const pesan = String(err?.message || err);
        if (pesan.includes('duplikat')) showAlert(pesan, 'Duplikat Terdeteksi');
        else tampilkanGalatServer(err, 'Gagal menyimpan data ke Firestore.');
    } finally {
        submitBtn.disabled = false;
    }
}

async function hapusWarga(id) {
    if (!confirm('Hapus data warga ini?')) return;
    try {
        await QurbanStore.hapus(id);
    } catch (err) {
        tampilkanGalatServer(err, 'Gagal menghapus data di Firestore.');
        return;
    }
    daftarWarga = daftarWarga.filter(w => w.id !== id);
    if (editingId === id) {
        editingId = null;
        setFormEditMode(false);
        document.getElementById('nama').value = '';
        document.getElementById('rt').value = '';
    }
    renderTable();
    renderStats();
}

async function hapusSemua() {
    if (!confirm('PERHATIAN: Hapus semua data warga?')) return;
    if (!confirm('Data di Firestore akan dikosongkan dan tidak bisa dikembalikan. Lanjutkan?')) return;
    try {
        await QurbanStore.hapusSemua();
    } catch (err) {
        tampilkanGalatServer(err, 'Gagal mengosongkan data di Firestore.');
        return;
    }
    daftarWarga = [];
    editingId = null;
    setFormEditMode(false);
    renderTable();
    renderStats();
}

function renderTable() {
    const tbody = document.querySelector('#tabelWarga tbody');
    const keyword = document.getElementById('cariWarga').value.toLowerCase();
    tbody.innerHTML = '';
    
    let filtered = daftarWarga.filter(w => 
        w.nama.toLowerCase().includes(keyword) || 
        w.rt.toLowerCase().includes(keyword)
    );

    const sorted = sortWargaCopy(filtered);

    const rowsHtml = sorted.map((w, index) => `
        <tr style="${w.sudahTukar ? 'opacity:0.55;' : ''}">
            <td>${index + 1}</td>

            <td style="font-weight:600;">${esc(w.nama.toUpperCase())}</td>

                <button class="btn btn-outline" data-edit-id="${escAttr(w.id)}" title="Edit data warga" style="padding:4px 8px; font-size:0.8em;">✎</button>

            </td>

    `).join('');

    document.getElementById('totalWarga').textContent = daftarWarga.length;
}

document.querySelector('#tabelWarga tbody').addEventListener('click', function(event) {
    const editBtn = event.target.closest('button[data-edit-id]');
    if (editBtn) {
        mulaiEdit(editBtn.dataset.editId);
        return;
    }
    const btn = event.target.closest('button[data-id]');
    if (btn) hapusWarga(btn.dataset.id);
});

document.querySelector('#tabelWarga tbody').addEventListener('change', async function(event) {
    const cb = event.target.closest('input[data-tukar-id]');
    if (!cb) return;
    const warga = cariWargaById(cb.dataset.tukarId);
    if (!warga) return;
    const nilaiBaru = cb.checked;
    warga.sudahTukar = nilaiBaru;
    renderStats();
    try {
        await QurbanStore.setTukar(warga.id, nilaiBaru);
    } catch (err) {
        warga.sudahTukar = !nilaiBaru;
        cb.checked = warga.sudahTukar;
        renderStats();
        tampilkanGalatServer(err, 'Gagal menyimpan status tukar ke Firestore.');
    }
});

function renderStats() {
    const statsContainer = document.getElementById('statsContainer');
    const tukarCount = daftarWarga.filter(w => w.sudahTukar).length;
    statsContainer.innerHTML = `
        <div class="stat-card">
            <span class="val">${tukarCount}/${daftarWarga.length}</span>
            <span class="lbl">Tukar Kupon</span>
        </div>
    `;

    const rtCounts = {};
    daftarWarga.forEach(w => {
        rtCounts[w.rt] = (rtCounts[w.rt] || 0) + 1;
    });
    
    const sortedRT = Object.keys(rtCounts).sort((a, b) => a.localeCompare(b, undefined, {numeric: true}));
    
    sortedRT.forEach(rt => {
        const card = `
            <div class="stat-card">
                <span class="val">${rtCounts[rt]}</span>
                <span class="lbl">RT ${esc(rt)}</span>
            </div>
        `;
        statsContainer.insertAdjacentHTML('beforeend', card);
    });
}

function buildKuponQrPayload(warga) {
    return `QURBAN|${warga.noKupon}|${warga.id}`;
}

function buildKuponQrSvg(warga) {
    try {
        const qr = qrcode(0, 'M');
        qr.addData(buildKuponQrPayload(warga));
        qr.make();
        return qr.createSvgTag({ cellSize: 2, margin: 0, scalable: true });
    } catch (err) {
        return '';
    }
}

function generateCoupons() {
    if (daftarWarga.length === 0) {
        showAlert('Belum ada data warga.', 'Data Kosong');
        return;
    }

    const printArea = document.getElementById('printArea');
    const cols = parseInt(document.getElementById('kuponKolom').value) || 3;
    const rows = parseInt(document.getElementById('kuponBaris').value) || 6;
    const margin = parseInt(document.getElementById('kuponMargin').value) || 10;
    const gap = parseInt(document.getElementById('kuponGap').value) || 2;
    const fontScale = (parseInt(document.getElementById('kuponFontSize').value) || 100) / 100;
    const qrAktif = (document.getElementById('kuponQR').value || '1') === '1';
    const qrSize = Math.min(25, Math.max(6, parseInt(document.getElementById('kuponQRSize').value) || 12));
    
    const sorted = sortWargaCopy();

    const thn = new Date().getFullYear();
    const thnH = document.getElementById('tahunHijriah').value || '....';

    // Re-render more carefully for multiple pages
    let allHtml = '';
    const itemsPerPage = cols * rows;
    
    // Hitung tinggi bersih area cetak (A4 297mm)
    // Kita gunakan kalkulasi mm yang presisi
    const availableHeight = 297 - (margin * 2);
    const singleCouponHeight = Math.floor((availableHeight - (gap * (rows - 1))) / rows);

    for (let i = 0; i < sorted.length; i += itemsPerPage) {
        const hasMorePages = i + itemsPerPage < sorted.length;
        const pageBreak = hasMorePages ? ' break-after: page; page-break-after: always;' : '';
        let pageHtml = `<div style="display:grid; grid-template-columns: repeat(${cols}, 1fr); grid-template-rows: repeat(${rows}, ${singleCouponHeight}mm); gap: ${gap}mm; padding: ${margin}mm; width: 210mm; height: 297mm; box-sizing: border-box;${pageBreak} background:white;">`;
        for (let j = i; j < i + itemsPerPage && j < sorted.length; j++) {
            const w = sorted[j];
            pageHtml += `
                <div class="coupon" style="height: ${singleCouponHeight}mm; border: 1px dashed #000 !important; margin: 0; box-sizing: border-box;">
                    <div class="watermark" style="font-size: ${20 * fontScale}px;">QURBAN</div>
                    <div class="coupon-header">
                        <div class="coupon-title" style="font-size:${8 * fontScale}px;">KUPON QURBAN</div>
                        <div class="coupon-no" style="font-size:${10 * fontScale}px;">${esc(formatKupon(w.noKupon))}</div>
                    </div>
                    <div class="coupon-body" style="text-align:center;${qrAktif ? ' display:flex; align-items:center; gap:4px;' : ''}">
                        <div style="${qrAktif ? 'flex:1;' : ''}">
                            <div class="coupon-name" style="font-size:${11 * fontScale}px;">${esc(w.nama.toUpperCase())}</div>
                            <div class="coupon-address" style="font-size:${8 * fontScale}px;">RT ${esc(w.rt)}</div>
                        </div>
                        ${qrAktif ? `<div class="coupon-qr" style="width:${qrSize}mm; height:${qrSize}mm;">${buildKuponQrSvg(w)}</div>` : ''}
                    </div>
                    <div class="coupon-footer" style="font-size:${7 * fontScale}px;">
                        <div>AL-HIKMAH - ${thnH} H</div>
                        <div style="font-weight:bold;">TUKAR DAGING</div>
                    </div>
                </div>
            `;
        }
        pageHtml += `</div>`;
        allHtml += pageHtml;
    }
    // Suntikkan margin dinamis khusus untuk cetak kupon
    const style = document.createElement('style');
    style.innerHTML = `@page { margin: 0 !important; }`;
    document.head.appendChild(style);

    printArea.innerHTML = allHtml;

    printArea.style.display = 'block';
    window.print();
    printArea.style.display = 'none';
    style.remove(); // Hapus margin dinamis setelah selesai
}

function importData(input) {
    if (input.files && input.files[0]) {
        const file = input.files[0];
        const fileName = file.name.toLowerCase();

        if (fileName.endsWith('.json')) {
            importFromJson(file, input);
            return;
        }

        if (fileName.endsWith('.csv') || fileName.endsWith('.xls') || fileName.endsWith('.xlsx')) {
            importFromSpreadsheet(file, input);
            return;
        }

        showAlert('Format file belum didukung. Gunakan: JSON, CSV, XLS, atau XLSX.', 'Format Tidak Didukung');
        input.value = '';
    }
}

function importFromJson(file, inputEl) {
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const importedData = JSON.parse(e.target.result);
            if (!Array.isArray(importedData)) {
                showAlert('Format JSON tidak valid!', 'Import Gagal');
                return;
            }

            const normalized = importedData
                .map(item => normalizeWargaRow(item))
                .filter(Boolean);

            if (normalized.length === 0) {
                showAlert('Tidak ada data warga valid pada file JSON.', 'Import Gagal');
                return;
            }

            applyImportedWarga(normalized);
        } catch (err) {
            showAlert('Gagal membaca file JSON: ' + err.message, 'Import Gagal');
        } finally {
            inputEl.value = '';
        }
    };
    reader.readAsText(file);
}

function importFromSpreadsheet(file, inputEl) {
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const workbook = XLSX.read(e.target.result, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            if (!firstSheetName) {
                showAlert('File tidak memiliki sheet.', 'Import Gagal');
                return;
            }

            const sheet = workbook.Sheets[firstSheetName];
            const rows = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: false });
            if (!rows.length) {
                showAlert('File tidak berisi data.', 'Import Gagal');
                return;
            }

            const normalized = rows
                .map(row => normalizeWargaRow(row))
                .filter(Boolean);

            if (normalized.length === 0) {
                showAlert('Tidak ditemukan kolom yang cocok. Gunakan header seperti: nama, nama warga, rt.', 'Import Gagal');
                return;
            }

            applyImportedWarga(normalized);
        } catch (err) {
            showAlert('Gagal membaca file spreadsheet: ' + err.message, 'Import Gagal');
        } finally {
            inputEl.value = '';
        }
    };
    reader.readAsArrayBuffer(file);
}

function normalizeWargaRow(row) {
    const keys = Object.keys(row || {});
    const keyNama = findKey(keys, ['nama', 'nama warga', 'warga', 'penerima', 'nama lengkap']);
    const keyRT = findKey(keys, ['rt', 'rt/rw', 'rt rw']);

    if (!keyNama || !keyRT) return null;

    const nama = String(row[keyNama] ?? '').trim();
    const rt = String(row[keyRT] ?? '').trim();
    if (!nama || !rt) return null;

    return {
        nama,
        rt,
        noKupon: (Number.isInteger(row.noKupon) && row.noKupon >= 1) ? row.noKupon : undefined,
        sudahTukar: row.sudahTukar === true
    };
}

function findKey(keys, candidates) {
    const normalizedKeys = keys.map(k => ({ original: k, norm: normalizeKey(k) }));
    for (const candidate of candidates) {
        const target = normalizeKey(candidate);
        const found = normalizedKeys.find(k => k.norm === target || k.norm.includes(target));
        if (found) return found.original;
    }
    return null;
}

function normalizeKey(value) {
    return String(value || '')
        .toLowerCase()
        .replace(/[^a-z0-9]/g, '');
}

async function applyImportedWarga(importedRows) {
    const mode = prompt(
        `Ditemukan ${importedRows.length} data valid.\nKetik 1 untuk TIMPA data lama.\nKetik 2 untuk GABUNG ke data lama.`,
        '2'
    );

    if (mode === null) return;
    if (mode !== '1' && mode !== '2') {
        showAlert('Pilihan tidak valid. Import dibatalkan.', 'Import Dibatalkan');
        return;
    }

    try {
        const hasil = await QurbanStore.importWarga(importedRows, mode === '1' ? 'timpa' : 'gabung');
        daftarWarga = await QurbanStore.muatSemua();
        renderTable();
        renderStats();

        const duplicateCount = hasil.duplikat || 0;
        const contohItems = hasil.contoh || [];
        const duplicatePreview = contohItems
            .slice(0, 8)
            .map((d, i) => `${i + 1}. ${d.nama} (RT ${d.rt})`)
            .join('\n');
        const duplicateTail = duplicateCount > 8
            ? `\n... dan ${duplicateCount - 8} data duplikat lainnya.`
            : '';

        showAlert(
            `Import selesai.\n` +
            `Data valid di file: ${hasil.valid}\n` +
            `Data ditambahkan: ${hasil.ditambahkan}\n` +
            `Duplikat dilewati: ${duplicateCount}` +
            (duplicateCount > 0 ? `\n\nContoh duplikat:\n${duplicatePreview}${duplicateTail}` : ''),
            'Ringkasan Import'
        );
    } catch (err) {
        tampilkanGalatServer(err, 'Gagal mengimpor data ke Firestore.');
    }
}
